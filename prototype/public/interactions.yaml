# HerStory prototype interactions
# ------------------------------------------------------------------
# This file is the single source of truth for control behaviour.
# Edit a `to:` target here, reload the page, and the prototype navigates
# there. No route regeneration and no TSX edits are needed.
#
# Rules are matched per surface (`data-ui-id`) by the control's visible text.
# `nth` disambiguates repeated labels on one surface (1-based); `scope`
# narrows the match to the nearest row/layer containing that text.
#
# Effects:
#   navigate: needs `to` (an existing Astro route)
#   back:     browser history back
#   action:   named handler, optionally followed by a `to` navigation
#
# Actions that do not mutate data explain the prototype boundary in a toast.
# Every control without a rule also explains itself when clicked.

# Schema v2 — see scripts/migrate-interactions-v2.mjs for the added keys.
